name: CD Deploy to Azure

on:
  push:
    branches: [ main ]

jobs:
  push_images_to_aks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Login to Azure
      uses: azure/Login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Azure CLI connect script 
      run: |
        az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        az aks get-credentials --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_CLUSTER_NAME }} --overwrite-existing
    - name: Azure kubectl setup
      uses: azure/setup-kubectl@v4
      with:
        version: "latest"
    - name: Restart pods
      run: |
        kubectl rollout restart deployment workoutreadservice-deployment
        kubectl rollout restart deployment workoutwriteservice-deployment
