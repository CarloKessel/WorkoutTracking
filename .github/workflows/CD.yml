name: CD Deploy to DockerHub

on:
  push:
    branches: [ main ]

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: [ ubuntu-latest ]
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    - name: Go to frontend
      run: cd Frontend/workouttracking-frontend
    - name: Build the frontend Docker image
      run: docker build -t workouttracking_frontend .
    - name: Add tag to image
      run: docker tag workouttracking_frontend &{{ secrets.DOCKERHUB_USERNAME }}/workouttracking_frontend
    - name: Push to Doecker Hub
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_frontend:latest
