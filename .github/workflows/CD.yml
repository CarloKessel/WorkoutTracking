name: CD Deploy to DockerHub

on:
  push:
    branches: [ main ]


jobs:
  push_images:
    name: Push Docker images to Docker Hub
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Build and tag frontend Docker image
      run: |
        docker build -t workouttracking_frontend ./Frontend/workouttracking-frontend
        docker tag $DOCKER_USERNAME/workouttracking_frontend $DOCKER_USERNAME/workouttracking_frontend:latest

    - name: Push frontend Docker image
      run: |
        docker push $DOCKER_USERNAME/workouttracking_frontend:latest

    - name: Build and tag workout service Docker image
      run: |
        docker build -t $DOCKER_USERNAME/workouttracking_workoutservice ./WorkoutTracking/WorkoutService
        docker tag $DOCKER_USERNAME/workouttracking_workoutservice $DOCKER_USERNAME/workouttracking_workoutservice:latest

    - name: Push workout service Docker image
      run: |
        docker push $DOCKER_USERNAME/workouttracking_workoutservice:latest
