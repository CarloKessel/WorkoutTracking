name: CD Deploy to DockerHub

on:
  push:
    branches: [ main ]


jobs:
  push_images:
    name: Push Docker images to Docker Hub
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build, tag and push frontend Docker image
      run: |
        docker build -t wt_frontend ./Frontend/workouttracking-frontend
        docker tag wt_frontend ${{ secrets.DOCKERHUB_USERNAME }}/wt_frontend:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/wt_frontend:latest

    - name: Build, tag and push API Gateway Docker image
      run: |
        cd Gateways/APIGateway
        docker build -f ./APIGateway/Dockerfile -t wt_apigateway .
        docker tag wt_apigateway ${{ secrets.DOCKERHUB_USERNAME }}/wt_apigateway:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/wt_apigateway:latest

    - name: Build, tag and push Read service Docker image
      run: |
        cd Services/Workout/ReadService
        docker build -f ./API/Dockerfile -t wt_workoutreadservice .
        docker tag wt_workoutreadservice ${{ secrets.DOCKERHUB_USERNAME }}/wt_workoutreadservice:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/wt_workoutreadservice:latest

    - name: Build, tag and push Write service Docker image
      run: |
        cd Services/Workout/WriteService
        docker build -f ./API/Dockerfile -t wt_workoutwriteservice .
        docker tag wt_workoutwriteservice ${{ secrets.DOCKERHUB_USERNAME }}/wt_workoutwriteservice:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/wt_workoutwriteservice:latest
