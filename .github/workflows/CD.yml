name: CD Deploy to DockerHub

on:
  push:
    branches: [ main ]


jobs:
  push_images:
    name: Push Docker images to Docker Hub
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and tag frontend Docker image
      run: |
        docker build -t workouttracking_frontend ./Frontend/workouttracking-frontend
        docker tag workouttracking_frontend ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_frontend:latest

    - name: Push frontend Docker image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_frontend:latest

    - name: Build and tag workout service Docker image
      run: |
        docker build -t workouttracking_workoutservice ./WorkoutTracking/WorkoutService
        docker tag workouttracking_workoutservice ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_workoutservice:latest

    - name: Push workout service Docker image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_workoutservice:latest
