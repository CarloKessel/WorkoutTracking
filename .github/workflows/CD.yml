name: CD Deploy to DockerHub

on:
  push:
    branches: [ main ]


jobs:
  push_images:
    name: Push Docker images to Docker Hub
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build, tag and push frontend Docker image
      run: |
        docker build -t workouttracking_frontend ./Frontend/workouttracking-frontend
        docker tag workouttracking_frontend ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_frontend:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_frontend:latest

    - name: Build, tag and push API Gateway Docker image
      run: |
        docker build -f ./Gateways/APIGateway/APIGateway/Dockerfile -t workouttracking_apigateway .
        docker tag workouttracking_apigateway ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_apigateway:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_apigateway:latest

    - name: Build, tag and push Read service Docker image
      run: |
        docker build -f ./Services/ReadService/API/Dockerfile -t workouttracking_readservice .
        docker tag workouttracking_readservice ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_readservice:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_readservice:latest

    - name: Build, tag and push Write service Docker image
      run: |
        docker build -f ./Services/WriteService/API/Dockerfile -t workouttracking_writeservice .
        docker tag workouttracking_writeservice ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_writeservice:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/workouttracking_writeservice:latest
