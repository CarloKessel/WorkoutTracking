name: WorkoutTracking Development CI

on: 
  pull_request:
    branches: [ develop ]

jobs:
  build-dotnet-apps:
    name: Build .NET Applications
    runs-on: [ ubuntu-latest ]
    strategy: 
      matrix: 
        dotnet-version: [8.x]
        working-directory: [ 'Services/Workout/ReadService', 'Services/Workout/ReadService', 'Gateways/APIGateway' ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup dotnet ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Install dependencies
        run: dotnet restore 
        working-directory: ${{ matrix.working-directory }}
      - name: Build application
        run: dotnet build
        working-directory: ${{ matrix.working-directory }}

  test-dotnet-apps:
    name: Test .NET Applications
    runs-on: [ ubuntu-latest ]
    strategy: 
        matrix: 
            dotnet-version: [ '8.x' ]
            working-directory: [ 'Services/Workout/ReadService', 'Services/Workout/ReadService' ]
    steps: 
        - uses: actions/checkout@v4
        - name: Setup dotnet ${{ matrix.dotnet-version }}
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: ${{ matrix.dotnet-version }}
        - name: Test with the dotnet CLI
          run: dotnet test
          working-directory: ${{ matrix.working-directory }}

  deploy-to-staging:
    name: Push Staging images to Docker Hub
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build, tag and push frontend Docker image
      run: |
        docker build -t wt_staging_frontend ./Frontend/workouttracking-frontend
        docker tag wt_staging_frontend ${{ secrets.DOCKERHUB_USERNAME }}/wt_staging_frontend:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/wt_staging_frontend:latest

    - name: Build, tag and push API Gateway Docker image
      run: |
        cd Gateways/APIGateway
        docker build -f ./APIGateway/Dockerfile -t wt_staging_apigateway .
        docker tag wt_staging_apigateway ${{ secrets.DOCKERHUB_USERNAME }}/wt_staging_apigateway:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/wt_staging_apigateway:latest

    - name: Build, tag and push Read service Docker image
      run: |
        cd Services/Workout/ReadService
        docker build -f ./API/Dockerfile -t wt_staging_workoutreadservice .
        docker tag wt_staging_workoutreadservice ${{ secrets.DOCKERHUB_USERNAME }}/wt_staging_workoutreadservice:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/wt_staging_workoutreadservice:latest

    - name: Build, tag and push Write service Docker image
      run: |
        cd Services/Workout/WriteService
        docker build -f ./API/Dockerfile -t wt_staging_workoutwriteservice .
        docker tag wt_staging_workoutwriteservice ${{ secrets.DOCKERHUB_USERNAME }}/wt_staging_workoutwriteservice:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/wt_staging_workoutwriteservice:latest
