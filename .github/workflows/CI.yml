name: WorkoutTracking Build and Test

on: 
    pull_request:
        branches: [ main, develop ]

jobs:
    load-tests:
      uses: ./.github/workflows/Load-Test.yml
      secrets:
        AUTH_TEST_TOKEN: ${{ secrets.AUTH_TEST_TOKEN }}
        READ_PG_USER: ${{ secrets.READ_PG_USER }}
        READ_PG_PW: ${{ secrets.READ_PG_PW }}
        PG_DB: ${{ secrets.PG_DB }}
        WRITE_PG_USER: ${{ secrets.WRITE_PG_USER }}
        WRITE_PG_PW: ${{ secrets.WRITE_PG_PW }}
        FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        ASPNETCORE_ENVIRONMENT: ${{ secrets.ASPNETCORE_ENVIRONMENT }}
        VM_PROMETHEUS_GATEWAY_URL: ${{ secrets.VM_PROMETHEUS_GATEWAY_URL }}
        VM_API_GATEWAY_URL: ${{ secrets.VM_API_GATEWAY_URL }}

    unit-tests: 
        uses: ./.github/workflows/Unit-Test.yml

    build: 
        runs-on: [ ubuntu-latest ]
        strategy: 
          matrix: 
            dotnet-version: [8.x]
            working-directory: [ 'Services/Workout/ReadService', 'Services/Workout/ReadService' ]

        steps:
            - uses: actions/checkout@v4
            - name: Setup dotnet ${{ matrix.dotnet-version }}
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: ${{ matrix.dotnet-version }}
            - name: Install dependencies
              run: dotnet restore 
              working-directory: ${{ matrix.working-directory }}
            - name: Build application
              run: dotnet build
              working-directory: ${{ matrix.working-directory }}
