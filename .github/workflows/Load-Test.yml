name: WorkoutTracking Load Tests

on: 
    workflow_call:

jobs:
    load-tests: 
        runs-on: [ ubuntu-latest ]

        steps: 
            - uses: actions/checkout@v4
            - name: Start containers
              run: docker-compose -f "docker-compose.yaml" up -d --build

            - name: Check connectivity to endpoint
              run: |
                # Add commands here to check connectivity to your endpoint
                curl -v http://0.0.0.0:8081/workout/2219b6f7-7883-4629-95d5-1a8a6c74b244
                # You can also try other commands like ping or telnet to diagnose connectivity issues
              continue-on-error: true
            - name: Check connectivity to endpoint
              run: |
                # Add commands here to check connectivity to your endpoint
                curl -v http://0.0.0.0:8081
                # You can also try other commands like ping or telnet to diagnose connectivity issues
              continue-on-error: true
            - name: Debug Information
              run: |
                # Add any additional debug information you need here, such as environment variables, network settings, etc.
                ip addr
                netstat -tuln
                docker ps

            - name: Execute load tests
              uses: artilleryio/action-cli@v1
              with:
                command: run ./Artillery-Load-Tests-Get-Endpoints.yml
            
            - name: Stop containers
              if: always()
              run: docker-compose -f "docker-compose.yaml" down
