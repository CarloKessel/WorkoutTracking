name: WorkoutTracking Load Tests

on: 
  workflow_call:
    secrets:
      AUTH_TEST_TOKEN:
        required: true
      READ_PG_USER:
        required: true
      READ_PG_PW:
        required: true
      PG_DB:
        required: true
      WRITE_PG_USER:
        required: true
      WRITE_PG_PW:
        required: true
      FRONTEND_URL:
        required: true
      ASPNETCORE_ENVIRONMENT:
        required: true

jobs:
  load-tests: 
    runs-on: [ ubuntu-latest ]
    steps: 
    - uses: actions/checkout@v4

    - name: Start containers
      env: 
        READ_PG_USER: ${{ secrets.READ_PG_USER }}
        READ_PG_PW: ${{ secrets.READ_PG_PW }}
        PG_DB: ${{ secrets.PG_DB }}
        WRITE_PG_USER: ${{ secrets.WRITE_PG_USER }}
        WRITE_PG_PW: ${{ secrets.WRITE_PG_PW }}
        FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        ASPNETCORE_ENVIRONMENT: ${{ secrets.ASPNETCORE_ENVIRONMENT }}
      run: docker-compose up -d

    - name: Install Artillery
      run: npm install -g artillery

    - name: Run Load Test
      run: |
        artillery run --variables "{\"baseUrl\": \"http://127.0.0.1:5001\", \"authTestToken\": \"${{ secrets.AUTH_TEST_TOKEN }}\"}" Artillery-Load-Tests-Get-Endpoints.yml

    - name: Stop containers
      run: docker-compose down
