name: WorkoutTracking Load Tests

on: 
  workflow_call:
    secrets:
      AUTH_TEST_TOKEN:
        required: true
      READ_PG_USER:
        required: true
      READ_PG_PW:
        required: true
      PG_DB:
        required: true
      WRITE_PG_USER:
        required: true
      WRITE_PG_PW:
        required: true
      FRONTEND_URL:
        required: true
      ASPNETCORE_ENVIRONMENT:
        required: true
      VM_PROMETHEUS_GATEWAY_URL:
        required: true
      VM_API_GATEWAY_URL:
        required: true

jobs:
  load-tests: 
    runs-on: [ ubuntu-latest ]
    steps: 
    - uses: actions/checkout@v4

    - name: Start containers
      env: 
        READ_PG_USER: ${{ secrets.READ_PG_USER }}
        READ_PG_PW: ${{ secrets.READ_PG_PW }}
        PG_DB: ${{ secrets.PG_DB }}
        WRITE_PG_USER: ${{ secrets.WRITE_PG_USER }}
        WRITE_PG_PW: ${{ secrets.WRITE_PG_PW }}
        FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        ASPNETCORE_ENVIRONMENT: ${{ secrets.ASPNETCORE_ENVIRONMENT }}
      run: docker-compose up -d
    
    - name: Get current date
      id: date
      run: echo "::set-output name=date::$(date +'%d-%m-%Y')"

    - name: Install Artillery
      run: npm install -g artillery

    - name: Run Load Test
      run: |
        artillery run --variables "{\"baseUrl\": \"${{ secrets.VM_API_GATEWAY_URL }}\", \"authTestToken\": \"${{ secrets.AUTH_TEST_TOKEN }}\", \"date\": \"${{ steps.date.outputs.date }}\", \"promeGatewayUrl\": \"${{ secrets.VM_PROMETHEUS_GATEWAY_URL }}\"}" Artillery-Load-Tests-Get-Endpoints.yml

    - name: Stop containers
      run: docker-compose down
