version: '3.8'

services:
  readdatabase:
    image: postgres
    restart: always
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: ${READ_PG_USER}
      POSTGRES_PASSWORD: ${READ_PG_PW}
      POSTGRES_DB: ${PG_DB}
    networks:
      - workouttracking-network
    container_name: readdatabase

  writedatabase:
    image: postgres
    restart: always
    ports:
      - "5441:5432"
    environment:
      POSTGRES_USER: ${WRITE_PG_USER}
      POSTGRES_PASSWORD: ${WRITE_PG_PW}
      POSTGRES_DB: ${PG_DB}
    networks:
      - workouttracking-network
    container_name: writedatabase

  frontend:
    image: carlovankessel/wt_frontend:latest
    ports:
      - "8080:8080"
    networks:
      - workouttracking-network
    container_name: frontend
    volumes:
      - ./Frontend/workouttracking-frontend:/app

  apigateway:
    image: carlovankessel/wt_apigateway:latest
    restart: always
    ports:
      - "5001:5001"
    environment:
      - Frontend__FrontendUrl=${FRONTEND_URL}
      - ApiKey=${GATEWAY_API_KEY}
      - Authentication__Schemes__Bearer__Authority=${AUTH_AUTHORITY}
      - Authentication__Schemes__Bearer__ValidAudiences=${AUTH_VALID_AUDIENCES}
      - Authentication__Schemes__Bearer__ValidIssuer=${AUTH_VALID_ISSUER}
      - ASPNETCORE_URLS=http://*:5001
    networks:
      - workouttracking-network
    container_name: apigateway

  readservice:
    image: carlovankessel/wt_workoutreadservice:latest
    restart: always
    depends_on:
      - readdatabase
    ports:
      - "5101:5101"
    networks:
      - workouttracking-network
    environment:
      - Database__DatabasConnectionString=Server=readdatabase;port=5432;Database=${PG_DB};User Id=${READ_PG_USER};Password=${READ_PG_PW};
      - APIGateway__APIGatewayUrl=http://apigateway:5001
      - ApiKey=${GATEWAY_API_KEY}
      - Authentication__Schemes__Bearer__Authority=${AUTH_AUTHORITY}
      - Authentication__Schemes__Bearer__ValidAudiences=${AUTH_VALID_AUDIENCES}
      - Authentication__Schemes__Bearer__ValidIssuer=${AUTH_VALID_ISSUER}
      - ASPNETCORE_URLS=http://*:5101
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    container_name: readservice

  writeservice:
    image: carlovankessel/wt_workoutwriteservice:latest
    restart: always
    depends_on:
      - writedatabase
    ports:
      - "5201:5201"
    networks:
      - workouttracking-network
    environment:
      - Database__DatabasConnectionString=Server=writedatabase;port=5432;Database=${PG_DB};User Id=${WRITE_PG_USER};Password=${WRITE_PG_PW};
      - APIGateway__APIGatewayUrl=http://apigateway:5001
      - ApiKey=${GATEWAY_API_KEY}
      - Authentication__Schemes__Bearer__Authority=${AUTH_AUTHORITY}
      - Authentication__Schemes__Bearer__ValidAudiences=${AUTH_VALID_AUDIENCES}
      - Authentication__Schemes__Bearer__ValidIssuer=${AUTH_VALID_ISSUER}
      - ASPNETCORE_URLS=http://*:5201
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    container_name: writeservice

networks:
  workouttracking-network:
    name: workouttracking-network
    driver: bridge
