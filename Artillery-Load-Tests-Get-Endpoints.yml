config:
  # It's designed to be highly scalable
  target: http://127.0.0.1:8081
  phases:
    - duration: 60
      arrivalRate: 1
      rampTo: 5
      name: Warm up phase
    - duration: 60
      arrivalRate: 5
      rampTo: 10
      name: Ramp up load
    - duration: 30
      arrivalRate: 10
      rampTo: 30
      name: Spike phase
  defaults:
    headers:
      Authorization: "Bearer AUTH_TOKEN"
  reporters:
    - log

scenarios: 
  - flow:
      - loop:
        - get:
            url: "/workout/2219b6f7-7883-4629-95d5-1a8a6c74b244"
        count: 100
