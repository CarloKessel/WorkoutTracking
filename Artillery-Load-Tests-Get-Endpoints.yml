config:
  target: '{{ baseUrl }}'
  phases:
    - duration: 60
      arrivalRate: 25
  defaults:
    headers:
      Connection: "keep-alive"
      Authorization: 'Bearer {{ authTestToken }}'
  plugins:
    publish-metrics:
      - type: prometheus
        pushgateway: '{{ promeGatewayUrl }}'
        tags:
          - 'testId:{{ date }}'

scenarios: 
  - flow:
      - loop:
        - post:
          url: "/write-api/workout" # Good case 201 response
          json:
            name: "Workout {{ loopCount }}"
            userEmail: "{{ userEmail }}"
        - get:
            url: "/read-api/workout/{{ loopCount }}" # Good case 200 response\
        - get:
            url: "/read-api/workout/push" # Bad case 400 response
        - get:
            url: "/read-api/workouts/user/{{ userEmail }}" # Good case 200 response
        count: 10
