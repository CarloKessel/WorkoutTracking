config:
  target: '{{ baseUrl }}'
  phases:
    - duration: 60
      arrivalRate: 1
      rampTo: 5
      name: Warm up phase
    - duration: 60
      arrivalRate: 5
      rampTo: 10
      name: Ramp up load
    - duration: 30
      arrivalRate: 10
      rampTo: 30
      name: Spike phase
  defaults:
    headers:
      Authorization: 'Bearer {{ authTestToken }}'

scenarios: 
  - flow:
      - loop:
        - get:
            url: "/read-api/workout/1" # Good case 200 response
        - get:
            url: "/read-api/workout/2" # Bad case 404 response
        - get:
            url: "/read-api/workout/push" # Bad case 400 response
        count: 10
