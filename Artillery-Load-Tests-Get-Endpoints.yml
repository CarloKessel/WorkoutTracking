config:
  target: '{{ baseUrl }}'
  http:
    timeout: 20
  phases:
    - duration: 60
      arrivalRate: 1
    - duration: 60
      arrivalRate: 2
    - duration: 60
      arrivalRate: 5
  defaults:
    headers:
      Connection: "keep-alive"
      Authorization: 'Bearer {{ authTestToken }}'
  plugins:
    publish-metrics:
      - type: prometheus
        pushgateway: '{{ promeGatewayUrl }}'
        tags:
          - 'testId:{{ date }}'

scenarios: 
  - name: "POST request"
    flow:
      - post:
          url: "/write-api/workout" # Good case 201 response
          json:
            name: "Pull"
            userEmail: "{{ userEmail }}"
  - name: "GET request"
    flow:
      - loop:
          - get:
              url: "/read-api/workout/efec1544-4518-47ce-9908-2389cb121382" # Good case 200 response
        count: 50
