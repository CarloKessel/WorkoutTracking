services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    container_name: rabbitmq
    networks:
      - workouttracking-network

  readdatabase:
    image: postgres
    restart: always
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    networks:
      - workouttracking-network
    container_name: readdatabase

  writedatabase:
    image: postgres
    restart: always
    ports:
      - "5441:5432"
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    networks:
      - workouttracking-network
    container_name: writedatabase

  frontend:
    image: carlovankessel/wt_frontend:latest
    ports:
      - "8080:8080"
    networks:
      - workouttracking-network
    container_name: frontend

  apigateway:
    image: carlovankessel/wt_apigateway:latest
    restart: always
    ports:
      - "5001:5001"
    environment:
      - Frontend__FrontendUrl=http://127.0.0.1:8080
      - ReverseProxy__Clusters__read-cluster__Destinations__destination1__Address=http://readservice:5101
      - ReverseProxy__Clusters__write-cluster__Destinations__destination1__Address=http://writeservice:5201
      - ReverseProxy__Routes__read-route__Transforms__1__Append=
      - ReverseProxy__Routes__write-route__Transforms__1__Append=
      - Authentication__Schemes__Bearer__Authority=
      - Authentication__Schemes__Bearer__ValidAudiences__0=
      - Authentication__Schemes__Bearer__ValidAudiences__1=
      - Authentication__Schemes__Bearer__ValidIssuer=
      - ASPNETCORE_URLS=http://*:5001
    networks:
      - workouttracking-network
    container_name: apigateway

  readservice:
    image: carlovankessel/wt_workoutreadservice:latest
    restart: always
    depends_on:
      - readdatabase
    ports:
      - "5101:5101"
    networks:
      - workouttracking-network
    environment:
      - Database__DatabasConnectionString=Server=readdatabase;port=5432;Database=WorkoutTracking;User Id=;Password=;
      - APIGateway__APIGatewayUrl=http://apigateway:5001
      - APIGateway__ApiKey=
      - Authentication__Schemes__Bearer__Authority=
      - Authentication__Schemes__Bearer__ValidAudiences=
      - Authentication__Schemes__Bearer__ValidAudiences__1=
      - Authentication__Schemes__Bearer__ValidIssuer=
      - ASPNETCORE_URLS=http://*:5101
      - ASPNETCORE_ENVIRONMENT=
    container_name: readservice

  writeservice:
    image: carlovankessel/wt_workoutwriteservice:latest
    restart: always
    depends_on:
      - writedatabase
    ports:
      - "5201:5201"
    networks:
      - workouttracking-network
    environment:
      - Database__DatabasConnectionString=Server=writedatabase;port=5432;Database=WorkoutTracking;User Id=;Password=;
      - APIGateway__APIGatewayUrl=http://apigateway:5001
      - APIGateway__ApiKey=
      - Authentication__Schemes__Bearer__Authority=
      - Authentication__Schemes__Bearer__ValidAudiences__0=
      - Authentication__Schemes__Bearer__ValidAudiences__1=
      - Authentication__Schemes__Bearer__ValidIssuer=
      - ASPNETCORE_URLS=http://*:5201
      - ASPNETCORE_ENVIRONMENT=
    container_name: writeservice

networks:
  workouttracking-network:
    name: workouttracking-network
    driver: bridge