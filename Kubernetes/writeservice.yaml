apiVersion: v1
kind: ServiceAccount
metadata:
  name: writeservice-sa
---
apiVersion: v1
kind: Service
metadata:
  name: writeservice
  labels:
    app: writeservice
    service: writeservice
spec:
  selector:
    app: writeservice
  ports:
    - name: http
      port: 8101
      targetPort: 5201
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writeservice-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writeservice
  template:
    metadata:
      labels:
        app: writeservice
    spec:
      serviceAccountName: writeservice-sa
      containers:
      - name: writeservice
        image: carlovankessel/workouttracking_writeservice:latest
        ports:
        - containerPort: 5201
        env:
        - name: Database__DatabasConnectionString
          value: "Server=writedatabase;port=5432;Database=WorkoutTracking;User Id=write;Password=d7yB3Dftse9gce46PoaB9ck8;"
        - name: APIGateway__APIGatewayUrl
          value: "http://apigateway:5001"
        - name: ASPNETCORE_URLS
          value: "http://*:5201"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
---
apiVersion: v1
kind: Service
metadata:
  name: writedatabase
spec:
  selector:
    app: writedatabase
  ports:
    - port: 5432
      targetPort: writedb-port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writedatabase-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writedatabase
  template:
    metadata:
      labels:
        app: writedatabase
    spec:
      containers:
      - name: writedatabase
        image: postgres
        ports:
        - containerPort: 5432
          name: writedb-port
        env:
        - name: POSTGRES_USER
          value: write
        - name: POSTGRES_PASSWORD
          value: d7yB3Dftse9gce46PoaB9ck8
        - name: POSTGRES_DB
          value: WorkoutTracking
