apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wt-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
  - host: 
    http:
      paths:
      - path: /read-api
        pathType: Prefix
        backend:
          service:
            name: workoutreadservice
            port:
              number: 8001
      - path: /write-api
        pathType: Prefix
        backend:
          service:
            name: workoutwriteservice
            port:
              number: 8101
